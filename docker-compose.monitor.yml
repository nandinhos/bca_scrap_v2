# Monitor do BCA Scrap em projeto Compose SEPARADO: derrubar a stack da
# aplicacao nao derruba o monitor, e vice-versa.
# Limite conhecido: roda na mesma VM — queda total da VM/hipervisor so e
# detectada por monitoramento da TI fora dela. Ver docs/runbook-operacao.md.
name: bca-monitor

services:
  monitor:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    mem_limit: 32m
    environment:
      HEALTH_URL: "https://host.docker.internal:18443/health"
      HEALTH_TOKEN: "${HEALTH_TOKEN:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./scripts/monitor-loop.sh:/monitor-loop.sh:ro
    entrypoint: ["sh", "/monitor-loop.sh"]
